[generate]
command:/usr/local/opnsense/scripts/ThreatPatrols/Autossh/autossh.py generate
parameters:
type:script_output
message:Generating autossh client configuration

[reconfigure]
command:/usr/local/opnsense/scripts/ThreatPatrols/Autossh/autossh.py reconfigure
parameters:
type:script_output
message:Reconfiguring autossh tunnels

[start]
command:/usr/local/etc/rc.d/opnsense-autossh start
parameters:
type:script_output
message:Starting all autossh tunnels

[stop]
command:/usr/local/etc/rc.d/opnsense-autossh stop
parameters:
type:script_output
message:Stopping all autossh tunnels

[restart]
command:/usr/local/etc/rc.d/opnsense-autossh restart
parameters:
type:script_output
message:Restarting all autossh tunnels

[status]
command:/usr/local/etc/rc.d/opnsense-autossh status
parameters:
type:script_output
message:Obtaining autossh status

[start_tunnel]
command:/usr/local/etc/rc.d/opnsense-autossh start_tunnel
parameters:%s
type:script_output
message:Starting autossh tunnel

[stop_tunnel]
command:/usr/local/etc/rc.d/opnsense-autossh stop_tunnel
parameters:%s
type:script_output
message:Stopping autossh tunnel

[restart_tunnel]
command:/usr/local/etc/rc.d/opnsense-autossh restart_tunnel
parameters:%s
type:script_output
message:Restarting autossh tunnel

[status_tunnel]
command:/usr/local/etc/rc.d/opnsense-autossh status_tunnel
parameters:%s
type:script_output
message:Obtaining autossh tunnel status

[keygen]
command:/usr/local/opnsense/scripts/ThreatPatrols/Autossh/autossh.py keygen --key-type
parameters:%s
type:script_output
message:Generating ssh key for autossh

[hostkeys]
command:/usr/local/opnsense/scripts/ThreatPatrols/Autossh/autossh.py hostkeys --uuid
parameters:%s
type:script_output
message:Reading known ssh host keys for an autossh tunnel

[connection_status]
command:/usr/local/opnsense/scripts/ThreatPatrols/Autossh/autossh.py connection_status
parameters:
type:script_output
message:Collecting autossh connection status

[version]
command:/usr/local/opnsense/scripts/ThreatPatrols/Autossh/autossh.py version
parameters:
type:script_output
message:Getting the autossh application version
